<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, intial-scale=1.0">
	<title>Adding Tables</title>
	
	<style>
  table {
    width: 100%;
    border-collapse: collapse; /* Merges double lines into a single clean border */
  }
  th, td {
    border: 1px solid black; /* Sets a 1-pixel solid black line */
    padding: 8px;
  }
</style>

</head>

<body>
<h1>Adding Tables</h1>

<table>
  <caption>Student Grades — LP1 and LP2</caption>
  <thead>
    <tr>
      <th >Student</th>
      <th >Learning Plan 1</th>
      <th >Learning Plan 2</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Alice</td>  
	  <td>94</td>  
	  <td>88</td>
    </tr>
    <tr>
      <td>Bob</td>    <td>87</td>  <td>92</td>
    </tr>
  </tbody>
</table>

</body>
</html>
